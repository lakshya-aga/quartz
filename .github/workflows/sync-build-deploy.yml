name: Sync vault, build, deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours (UTC)
  push:
    branches: [ v4, main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Quartz repo
        uses: actions/checkout@v4

      - name: Checkout Vault repo into ./vault
        uses: actions/checkout@v4
        with:
          repository: lakshya-aga/ubiquitous-enigma
          token: ${{ github.token }}
          path: vault

      - name: Copy vault notes into Quartz content
        run: |
          rm -rf content
          mkdir -p content
          rsync -av --delete vault/ content/ \
            --exclude ".git/" \
            --exclude ".obsidian/" \
            --exclude ".github/"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
