name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Quartz repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info

      - name: Checkout Obsidian vault repo into ./vault
        uses: actions/checkout@v4
        with:
          repository: lakshya-aga/ubiquitous-enigma
          path: vault
          fetch-depth: 1

      - name: Sync vault -> Quartz content/
        run: |
          rm -rf content
          mkdir -p content
          rsync -av --delete vault/ content/ \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".obsidian/" \
            --exclude ".DS_Store"

          # Ensure Quartz has a homepage at content/index.md
          if [ ! -f "content/index.md" ]; then
            if [ -f "content/Welcome.md" ]; then
              cat > content/index.md << 'EOF'
              # Home

              Start here: [[Welcome]]
              EOF
            else
              cat > content/index.md << 'EOF'
              # Home

              This site is generated from my Obsidian vault.
              EOF
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
